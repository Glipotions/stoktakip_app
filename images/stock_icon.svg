<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="100" fill="#2196F3"/>
  <g transform="translate(80, 80) scale(0.7)">
    <!-- Barcode -->
    <rect x="60" y="100" width="20" height="200" fill="white"/>
    <rect x="100" y="100" width="40" height="200" fill="white"/>
    <rect x="160" y="100" width="20" height="200" fill="white"/>
    <rect x="200" y="100" width="60" height="200" fill="white"/>
    <rect x="280" y="100" width="40" height="200" fill="white"/>
    <rect x="340" y="100" width="20" height="200" fill="white"/>
    <rect x="380" y="100" width="40" height="200" fill="white"/>
    
    <!-- Chart Line -->
    <polyline points="60,350 120,320 180,340 240,280 300,260 360,300 420,240" 
              stroke="white" stroke-width="10" fill="none"/>
    
    <!-- Circle Dots -->
    <circle cx="60" cy="350" r="10" fill="white"/>
    <circle cx="120" cy="320" r="10" fill="white"/>
    <circle cx="180" cy="340" r="10" fill="white"/>
    <circle cx="240" cy="280" r="10" fill="white"/>
    <circle cx="300" cy="260" r="10" fill="white"/>
    <circle cx="360" cy="300" r="10" fill="white"/>
    <circle cx="420" cy="240" r="10" fill="white"/>
  </g>
</svg>
